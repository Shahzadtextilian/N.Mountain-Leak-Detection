    <script>
      // Single Page Application routing fallback: redirect to base path preserving route
      (function() {
        var path = window.location.pathname;
        if (path && path !== '/') {
          window.location.replace('/' + (path.startsWith('/') ? path.substring(1) : path));
        } else {
          window.location.replace('/');
        }
      })();
    </script>
